quarkus.http.port=8182
quarkus.flyway.enabled=true
quarkus.flyway.default-schema=write_ms_qrk
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true
mp.messaging.outgoing.product-created-channel.topic=product-events
mp.messaging.outgoing.product-created-channel.connector=smallrye-kafka
mp.messaging.outgoing.product-created-channel.bootstrap.servers=localhost:29092
mp.messaging.outgoing.product-created-channel.retries=1
mp.messaging.outgoing.product-updated-channel.topic=product-events
mp.messaging.outgoing.product-updated-channel.connector=smallrye-kafka
mp.messaging.outgoing.product-updated-channel.bootstrap.servers=localhost:29092
mp.messaging.outgoing.product-updated-channel.retries=1
mp.messaging.outgoing.product-deleted-channel.topic=product-events
mp.messaging.outgoing.product-deleted-channel.connector=smallrye-kafka
mp.messaging.outgoing.product-deleted-channel.bootstrap.servers=localhost:29092
mp.messaging.outgoing.product-deleted-channel.retries=1
